# Runs the unit and mocked end-to-end tests when started by hand from the Actions tab.
# Push and pull_request triggers are off while the account's Actions billing is blocked (jobs never start);
# restore `push: branches: [main, develop]` and `pull_request:` once billing works.
# The package is installed with its pinned dependencies so tests import the patched aider, not a released one.
# macOS-only tests (sandbox-exec) skip themselves on Linux.
name: tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python .
      - name: Unit tests
        run: |
          git config --global user.email "ci@localhost"
          git config --global user.name "ci"
          .venv/bin/python -m unittest discover -s tests -v
